<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Case not found · DIAS77</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        /* Arquivos de fonte sem alteração (licença Humane). CSS embutido: a CSP não permite script inline. */
        @font-face { font-family: Humane; font-weight: 700; font-display: swap; src: url('/fonts/Humane-Bold.woff2') format('woff2'); }
        :root { --ink: #0d0d0d; --paper: #f3f0e8; --red: #c4231c; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
            background: var(--ink); color: var(--paper); text-align: center;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
        main { display: grid; justify-items: center; gap: 24px; }
        .label { background: var(--red); color: var(--paper); padding: 4px 8px; font-size: 11px; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase; }
        h1 { margin: 0; font: 700 clamp(64px, 16vw, 200px) / 0.85 Humane, 'Arial Narrow', Impact, sans-serif; letter-spacing: 0.02em; }
        p { margin: 0; color: var(--paper); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; }
        a { display: inline-block; padding: 12px 20px; background: var(--paper); color: var(--ink); text-decoration: none;
            font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
        a:hover { box-shadow: 4px 4px 0 var(--red); }
        a:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <span class="label">Error 404</span>
        <h1>CASE NOT FOUND</h1>
        <p>No file with this number is in the archive.</p>
        <a href="/">Back to DIAS77</a>
    </main>
</body>
</html>
