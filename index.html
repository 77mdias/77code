  <style>
    /* Casca estática: pinta o quadro 1 e o loading antes do JS; fica sob o loading do React (z 100) e sai logo depois (main.tsx/App), fora do #root para o LCP ter tempo de registrar o quadro. Mesma geometria de Opening.module.css/.jean (1% maior, para o quadro do React, que respira até 0,6%, nunca virar um LCP maior) e Loading.module.css */
    #shell { position: fixed; inset: 0; z-index: 99; overflow: hidden; background: #0d0d0d; }
    #shell picture img { position: absolute; bottom: 0; left: 77%; height: calc(100svh * 1.01); width: calc(100svh * 1.01 * 16 / 9); margin-left: calc(100svh * 1.01 * 16 / 9 * -0.526); }
    #shell .ld { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: #0d0d0d; color: #f3f0e8; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    #shell .ld b { font: 700 clamp(40px, 8vw, 72px) / 1 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    #shell .ld p { margin: 0; font: 700 11px / 1.2 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: 0.22em; text-transform: uppercase; }
    @media (max-width: 767px) { #shell picture img { height: calc(62svh * 1.01); width: calc(62svh * 1.01 * 16 / 9); margin-left: calc(62svh * 1.01 * 16 / 9 * -0.526); left: 50%; } }
  </style>
